[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/vendor/**" = ["ALL"]
"assets/**" = ["ALL"]
"scripts/jy_wrapper.py" = ["E402"]
"tests/test_reliable.py" = ["E402"]
